services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - ${HOME}/.claude/skills:/skills/claude:ro
      - ${HOME}/.agents/skills:/skills/agents:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - COPILOTKIT_TELEMETRY_DISABLED=true
      - SKILLS_ROOTS=/skills/claude,/skills/agents
    stdin_open: true
    tty: true
